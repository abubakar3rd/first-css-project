<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CSS | A smarter way into real estate</title>
    <meta name="description"
        content="Buying your first home or growing a portfolio? CSS helps you make your next property move with confidence.">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="heading-wrap">
            <a class="brand" href="index.html">CSS</a>
            <nav aria-label="Main">
                <a href="index.html" aria-current="page">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero-inner">
                <div class="hero-copy">
                    <h1>A fastest way into <em>real estate.</em></h1>
                    <p>Buying your first home or growing a portfolio? We help you make your next move with confidence.
                    </p>
                    <div class="hero-actions">
                        <a class="btn btn-primary" href="contact.html">Contact us</a>
                        <a class="btn btn-ghost" href="#partners">Meet our partners</a>
                    </div>
                </div>
                <div class="hero-visual">
                    <img src="images/real-estate.jpg" width="612" height="344"
                        alt="An open hand holding glowing outlines of houses and dollar symbols">
                </div>
            </div>
        </section>
        <section class="our-partners" id="partners">
            <h2>Our Partners</h2>
            <div class="partners-logo">
                <div class="partner"><img src="images/moonshot.jpg" alt="Moonshot Business Academy"></div>
                <div class="partner"><img src="images/the-schoolmate.png" alt="The School Mate"></div>
                <div class="partner"><img src="images/icampus.png" alt="iCampus"></div>
                <div class="partner"><img class="logo-starz" src="images/starz.png" alt="Starz University"></div>
            </div>
        </section>
        <section class="cta">
            <div class="cta-inner">
                <h2>Ready to make your move?</h2>
                <a class="btn btn-dark" href="contact.html">Contact us</a>
            </div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 CSS. All rights reserved.</p>
    </footer>
</body>

</html>
